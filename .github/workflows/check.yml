# PROTECTED (kernel). Runs on every change Ghosty proposes. A change can only be shipped
# when every job here passes. Ghosty reads the results with change_status / wait_for_checks
# and fixes failures before asking you to ship.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Typecheck and tests
        run: |
          npm run typecheck > tc.txt 2>&1 || { echo "::error title=brain typecheck::$(grep -E 'error TS' tc.txt | head -n 8 | cut -c1-220 | tr '\n' '|')"; cat tc.txt; exit 1; }
          npm test > t.txt 2>&1 || { echo "::error title=brain tests::$(grep -E 'not ok|Error|expected|actual' t.txt | head -n 12 | cut -c1-200 | tr '\n' '|')"; cat t.txt; exit 1; }
  interface:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run typecheck > tc.txt 2>&1 || { echo "::error title=interface typecheck::$(grep -E 'error TS' tc.txt | head -n 8 | cut -c1-220 | tr '\n' '|')"; cat tc.txt; exit 1; }
          npm run build > b.txt 2>&1 || { echo "::error title=interface build::$(tail -n 10 b.txt | cut -c1-200 | tr '\n' '|')"; cat b.txt; exit 1; }
  # The same build Cloudflare runs (interface + Worker bundle + config), without deploying.
  deploy-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Cloudflare build (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry > w.txt 2>&1 || { echo "::error title=cloudflare build::$(grep -v '^\s*$' w.txt | tail -n 10 | cut -c1-200 | tr '\n' '|')"; cat w.txt; exit 1; }
      - name: Preview build diagnostics (does not block)
        continue-on-error: true
        run: |
          npx wrangler preview --dry-run > p.txt 2>&1; echo "::warning title=preview dry run::$(grep -v '^\s*$' p.txt | tail -n 10 | cut -c1-200 | tr '\n' '|')"
          cat p.txt
  # Opens the built interface in a real browser (phone and desktop sizes) and clicks
  # through chat, approvals, tabs, agenda, radio and the app/notifications setup.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: apps/edge
      - run: npm test
        working-directory: apps/edge
      - run: npm install --no-audit --no-fund --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Browser run
        run: |
          node tests/preview-server.mjs > preview.log 2>&1 &
          sleep 3
          fail=0
          for s in ui agenda media app; do
            if ! node tests/$s.spec.mjs tests/.shots > out-$s.txt 2>&1; then
              fail=1
              # Annotations are readable through the API (Ghosty reads them to fix its changes).
              echo "::error title=browser check: $s::$(grep -v '^\s*$' out-$s.txt | tail -n 12 | cut -c1-200 | tr '\n' '|')"
            fi
            cat out-$s.txt
          done
          exit $fail
      - if: failure()
        run: cat preview.log || true
