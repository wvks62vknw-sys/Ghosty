# PROTECTED (kernel). Runs on every change Ghosty proposes. Ghosty reads the result with
# change_status and fixes failures before asking you to ship.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
  interface:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
