# PROTECTED (kernel). Runs on every change Ghosty proposes. A change can only be shipped
# when every job here passes. Ghosty reads the results with change_status / wait_for_checks
# and fixes failures before asking you to ship.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Typecheck and tests
        run: |
          npm run typecheck > tc.txt 2>&1 || { echo "::error title=brain typecheck::$(grep -E 'error TS' tc.txt | head -n 8 | cut -c1-220 | tr '\n' '|')"; cat tc.txt; exit 1; }
          npm test > t.txt 2>&1 || { echo "::error title=brain tests::$(grep -E 'not ok|Error|expected|actual' t.txt | head -n 12 | cut -c1-200 | tr '\n' '|')"; cat t.txt; exit 1; }
      # The weekly training notebook's own checks (no GPU, no torch: the parts that need them are skipped),
      # and the bundled notebook and gym program are up to date with their sources.
      - name: Training notebook checks
        working-directory: .
        run: |
          python3 training/kaggle/test_ghosty_weekly.py > py.txt 2>&1 || { echo "::error title=training notebook::$(tail -n 12 py.txt | cut -c1-200 | tr '\n' '|')"; cat py.txt; exit 1; }
          node training/kaggle/build.mjs --check
  interface:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run typecheck > tc.txt 2>&1 || { echo "::error title=interface typecheck::$(grep -E 'error TS' tc.txt | head -n 8 | cut -c1-220 | tr '\n' '|')"; cat tc.txt; exit 1; }
          npm run build > b.txt 2>&1 || { echo "::error title=interface build::$(tail -n 10 b.txt | cut -c1-200 | tr '\n' '|')"; cat b.txt; exit 1; }
  # The same build Cloudflare runs (interface + Worker bundle + config), without deploying.
  deploy-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Cloudflare build (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry > w.txt 2>&1 || { echo "::error title=cloudflare build::$(grep -v '^\s*$' w.txt | tail -n 10 | cut -c1-200 | tr '\n' '|')"; cat w.txt; exit 1; }
      # Cloudflare's "Root directory" may be left empty: the root wrangler.jsonc must build too.
      - name: Cloudflare build from the repository root (dry run)
        working-directory: .
        run: ./apps/edge/node_modules/.bin/wrangler deploy --dry-run --outdir .wrangler-dry-root > w.txt 2>&1 || { echo "::error title=cloudflare build (root)::$(grep -v '^\s*$' w.txt | tail -n 10 | cut -c1-200 | tr '\n' '|')"; cat w.txt; exit 1; }
  # Opens the built interface in a real browser (phone and desktop sizes) and clicks
  # through chat, approvals, tabs, agenda, radio and the app/notifications setup.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: apps/edge
      - run: npm test
        working-directory: apps/edge
      - run: npm install --no-audit --no-fund --no-save playwright@1.56.0 && npx playwright install --with-deps chromium webkit
      - name: Browser run
        run: |
          node tests/preview-server.mjs > preview.log 2>&1 &
          sleep 3
          fail=0
          # [markman] [night] [photo] [bigbrain] [threats] [eye] [brief] [places] [scroll] mark, manuals, night, photo, bigbrain, threats, eye, brief and places joined the loop on 24 Oct (each has its own spec) [markets] [settings] [nav] [radio]
          for s in ui agenda media app layout widgets library sites streetview map map3d cameras training intel westmidlands eye lens scan name progress telegram voice direct journey memory projects upgrades aim offlinebrain measure space vehicle sound studio learn cited scroll safari backup notifications threats airoom gym character selftrain thinkharder meaning bigbrain websites studiomake apps school hero routec homeplan deck speed mark manuals night photo brief places scrollfeel markets settings nav radio; do
            # Street View's dives follow the frames, which software rendering draws slowly: give each run up to 8 minutes.
            if ! timeout 480 node tests/$s.spec.mjs tests/.shots > out-$s.txt 2>&1; then
              fail=1
              # Annotations are readable through the API (Ghosty reads them to fix its changes).
              echo "::error title=browser check: $s::$(grep -v '^\s*$' out-$s.txt | tail -n 12 | cut -c1-200 | tr '\n' '|')"
            fi
            cat out-$s.txt
          done
          exit $fail
      - if: failure()
        run: cat preview.log || true
  # If anything lands on main that fails these checks (even a change merged by hand on
  # GitHub), put main back to the last version where every check passed. Cloudflare then
  # redeploys that version. Ghosty and the owner are told through the Workshop history.
  guard:
    needs: [brain, interface, deploy-build, smoke]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - name: Restore the last version that passed every check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then echo "main has moved on; nothing to do"; exit 0; fi
          good=""
          for sha in $(git rev-list --first-parent -n 40 origin/main | tail -n +2); do
            res=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs?per_page=50" --jq '[.check_runs[] | select(.name=="brain" or .name=="interface" or .name=="smoke" or .name=="deploy-build") | .conclusion] | (length >= 4 and all(. == "success"))')
            if [ "$res" = "true" ]; then good=$sha; break; fi
          done
          if [ -z "$good" ]; then echo "::warning::no earlier passing version found"; exit 0; fi
          git config user.name "ghosty-guard"
          git config user.email "ghosty-guard@users.noreply.github.com"
          git read-tree -u --reset "$good"
          git commit -m "Undo broken change: restore ${good:0:7} (checks failed on ${GITHUB_SHA:0:7})" || exit 0
          git push origin HEAD:main
          echo "::warning title=guard::Checks failed on ${GITHUB_SHA:0:7}; main restored to ${good:0:7}"
