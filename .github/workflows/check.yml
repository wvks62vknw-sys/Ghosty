# PROTECTED (kernel). Runs on every change Ghosty proposes. A change can only be shipped
# when every job here passes. Ghosty reads the results with change_status / wait_for_checks
# and fixes failures before asking you to ship.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Typecheck and tests
        run: |
          npm run typecheck > tc.txt 2>&1 || { echo "::error title=brain typecheck::$(grep -E 'error TS' tc.txt | head -n 8 | cut -c1-220 | tr '\n' '|')"; cat tc.txt; exit 1; }
          npm test > t.txt 2>&1 || { echo "::error title=brain tests::$(grep -E 'not ok|Error|expected|actual' t.txt | head -n 12 | cut -c1-200 | tr '\n' '|')"; cat t.txt; exit 1; }
      # The weekly training notebook's own checks (no GPU, no torch: the parts that need them are skipped),
      # and the bundled notebook and gym program are up to date with their sources.
      - name: Training notebook checks
        working-directory: .
        run: |
          python3 training/kaggle/test_ghosty_weekly.py > py.txt 2>&1 || { echo "::error title=training notebook::$(tail -n 12 py.txt | cut -c1-200 | tr '\n' '|')"; cat py.txt; exit 1; }
          node training/kaggle/build.mjs --check
  interface:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run typecheck > tc.txt 2>&1 || { echo "::error title=interface typecheck::$(grep -E 'error TS' tc.txt | head -n 8 | cut -c1-220 | tr '\n' '|')"; cat tc.txt; exit 1; }
          npm run build > b.txt 2>&1 || { echo "::error title=interface build::$(tail -n 10 b.txt | cut -c1-200 | tr '\n' '|')"; cat b.txt; exit 1; }
  # The same build Cloudflare runs (interface + Worker bundle + config), without deploying.
  deploy-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Cloudflare build (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry > w.txt 2>&1 || { echo "::error title=cloudflare build::$(grep -v '^\s*$' w.txt | tail -n 10 | cut -c1-200 | tr '\n' '|')"; cat w.txt; exit 1; }
      # Cloudflare's "Root directory" may be left empty: the root wrangler.jsonc must build too.
      - name: Cloudflare build from the repository root (dry run)
        working-directory: .
        run: ./apps/edge/node_modules/.bin/wrangler deploy --dry-run --outdir .wrangler-dry-root > w.txt 2>&1 || { echo "::error title=cloudflare build (root)::$(grep -v '^\s*$' w.txt | tail -n 10 | cut -c1-200 | tr '\n' '|')"; cat w.txt; exit 1; }
  # Opens the built interface in a real browser (phone and desktop sizes) and clicks
  # through chat, approvals, tabs, agenda, radio and the app/notifications setup.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: apps/edge
      - run: npm test
        working-directory: apps/edge
      - run: npm install --no-audit --no-fund --no-save playwright@1.56.0 && npx playwright install --with-deps chromium webkit
      - name: The free game data the engines spec plays (35 MB from the Internet Archive, checksums checked; never committed)
        run: |
          sh tests/fixtures/engines/fetch.sh || echo "::warning title=engines data::The free game data could not be fetched from archive.org: the engines spec and the arcade spec's native-engine checks skip with one line."
      - name: Browser run
        run: |
          node tests/preview-server.mjs > preview.log 2>&1 &
          sleep 3
          fail=0
          # [markman] [night] [photo] [bigbrain] [threats] [eye] [brief] [places] [scroll] mark, manuals, night, photo, bigbrain, threats, eye, brief and places joined the loop on 24 Oct (each has its own spec) [markets] [settings] [nav] [radio] [reverse] [boot] boot, hubcards, spending and undo joined on 25 Oct (written 24 Oct, left out of the loop) [sit] sit joined on 30 Oct (OWNER-ISSUES 57c: heavy mode, the reload mid-paper, a failed brain, the smallest brain) [onphone] onphone joined on 30 Oct (OWNER-ISSUES 72: the marker test, the on-device choice fails closed) [independence] independence joined on 31 Oct (OWNER-ISSUES 78: the meter and Sovereign Mode) [abilities] abilities joined on 31 Oct (OWNER-ISSUES 68: everything he can do, "can you…?", WHY, today, offers in context) [faces] [guardian] faces and guardian joined on 31 Oct (OWNER-ISSUES 55, 56, 58, 60: his face and the people he introduces, on the phone only; the watch near his places, WALK ME HOME, the panic phrase, a scam checked) — both before websites: neither needs what the later specs built, and guardian puts back what it changes [machine] [foresight] machine and foresight joined on 31 Oct (OWNER-ISSUES 61c: the Machine view, right after eye; 61a: foresight, the ledger and its scoring, before websites) — neither needs what the later specs built, and both put back what they change [workbench] [tunnel] workbench and tunnel joined on 31 Oct (OWNER-ISSUES 61b: the Workbench's estimates and its wind tunnel, right after studio) — neither needs what the later specs built, and neither changes the brain
          for s in ui agenda media app layout widgets library sites streetview map map3d cameras training intel westmidlands eye machine lens scan name faces progress telegram voice direct journey memory projects upgrades aim offlinebrain onphone measure space vehicle sound studio workbench tunnel learn cited scroll safari backup notifications threats guardian airoom gym character selftrain thinkharder independence meaning bigbrain foresight websites studiomake apps school sit hero routec homeplan deck speed mark manuals night photo brief cards car places scrollfeel markets settings nav radio reverse boot hubcards spending undo abilities packs arcade games2 games3 engines; do
            # Street View's dives follow the frames, which software rendering draws slowly: give each run up to 8 minutes.
            # [sections] nav and routec walk every pill of nine screens in sections: 248 s and 357 s on run 243 before the
            # rollout, which roughly doubled nav; they get 12 minutes, the rest 8.
            t=480; case $s in nav|routec) t=720;; esac
            if ! timeout $t node tests/$s.spec.mjs tests/.shots > out-$s.txt 2>&1; then
              # [retry] One more try before it counts: a real failure fails twice; a flake that passes the second time is
              # said loudly (never hidden) so it gets fixed. The guard reverted main twice in a week on single-run flakes
              # (voice near a slow calibration, routec across midnight): HANDOFF, 31 Oct.
              echo "::warning title=browser check: $s failed once::$(grep -v '^\s*$' out-$s.txt | tail -n 6 | cut -c1-200 | tr '\n' '|')"
              cat out-$s.txt
              if ! timeout $t node tests/$s.spec.mjs tests/.shots > out-$s.txt 2>&1; then
                fail=1
                # Annotations are readable through the API (Ghosty reads them to fix its changes).
                echo "::error title=browser check: $s::$(grep -v '^\s*$' out-$s.txt | tail -n 12 | cut -c1-200 | tr '\n' '|')"
              else
                echo "::warning title=flaky spec: $s::failed once, passed on the second try: fix the flake at its cause"
              fi
            fi
            cat out-$s.txt
          done
          exit $fail
      - if: failure()
        run: cat preview.log || true
  # If anything lands on main that fails these checks (even a change merged by hand on
  # GitHub), put main back to the last version where every check passed. Cloudflare then
  # redeploys that version. Ghosty and the owner are told through the Workshop history.
  guard:
    needs: [brain, interface, deploy-build, smoke]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - name: Restore the last version that passed every check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then echo "main has moved on; nothing to do"; exit 0; fi
          good=""
          for sha in $(git rev-list --first-parent -n 40 origin/main | tail -n +2); do
            res=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs?per_page=50" --jq '[.check_runs[] | select(.name=="brain" or .name=="interface" or .name=="smoke" or .name=="deploy-build") | .conclusion] | (length >= 4 and all(. == "success"))')
            if [ "$res" = "true" ]; then good=$sha; break; fi
          done
          if [ -z "$good" ]; then echo "::warning::no earlier passing version found"; exit 0; fi
          git config user.name "ghosty-guard"
          git config user.email "ghosty-guard@users.noreply.github.com"
          git read-tree -u --reset "$good"
          git commit -m "Undo broken change: restore ${good:0:7} (checks failed on ${GITHUB_SHA:0:7})" || exit 0
          git push origin HEAD:main
          echo "::warning title=guard::Checks failed on ${GITHUB_SHA:0:7}; main restored to ${good:0:7}"
