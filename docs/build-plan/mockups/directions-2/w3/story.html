<body><h1>W3 · The Eye <span>· Home becomes the 7:42, in motion</span></h1><p class="lede">The orb is an eye: what it looks at is sharp, everything else is grain. Asked for his train, it lets go of the book, searches the wall, locks on New Street, and the attention takes the screen.</p><div class="row"><figure><div class="ph"><img src="story-1-390.png" alt="He asks"></div><figcaption><b>1 · He asks</b>07:12. He types “When’s my train?”. The eye lets go of tonight’s book; the wall falls back to grain.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-2-390.png" alt="Searching"></div><figcaption><b>2 · Searching</b>The reticle hops feed to feed (the Agenda, God’s eye, the Brief), 90 ms a hop, the line of sight following.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-3-390.png" alt="Locked"></div><figcaption><b>3 · Locked</b>It locks on New Street. That feed opens in the centre, sharp; the line of sight holds on the station.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-4-390.png" alt="The Stage"></div><figcaption><b>4 · The Stage</b>The attention takes the screen: the city in grain except the way he is going, the station boxed, the sentence after.</figcaption></figure></div></body></html>
