<body><h1>W2 · The Map <span>· Home becomes the 7:42, in motion</span></h1><p class="lede">Everything Ghosty can see and do is plotted on one map round the orb. He types a word; the camera rises, crosses and dives, and at the deepest zoom the point is the thing.</p><div class="row"><figure><div class="ph"><img src="story-1-390.png" alt="He types a word"></div><figcaption><b>1 · He types a word</b>07:12. He types “train”. Before he finishes, the Journey is plotted in Plan and a flight path runs to it from the orb.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-2-390.png" alt="Up"></div><figcaption><b>2 · Up</b>The camera rises: the whole field at once, every area and every point; the scale moves to All.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-3-390.png" alt="Across and down"></div><figcaption><b>3 · Across and down</b>It crosses to Plan and dives at the Journey’s point; inside its square the field is already the city.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-4-390.png" alt="The Stage"></div><figcaption><b>4 · The Stage</b>At the deepest zoom the point is the thing: the streets, the walk and the train. Pinch out and he is home.</figcaption></figure></div></body></html>
