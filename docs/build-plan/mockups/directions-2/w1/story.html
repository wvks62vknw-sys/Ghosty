<body><h1>W1 · The Scan <span>· Home becomes the 7:42, in motion</span></h1><p class="lede">The phone is a window into a 3-D scan of a room where everything Ghosty does has its place. Asked for his train, the eye turns to the window and the city outside is brought to the front.</p><div class="row"><figure><div class="ph"><img src="story-1-390.png" alt="He asks"></div><figcaption><b>1 · He asks</b>07:12. He types “When’s my train?”. The other tags let go; the eye turns to the window, where the answer is.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-2-390.png" alt="The eye locks"></div><figcaption><b>2 · The eye locks</b>One reticle locks on the window: Birmingham New Street. The camera starts across the room towards it.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-3-390.png" alt="Through the window"></div><figcaption><b>3 · Through the window</b>The room falls away behind; the city outside resolves from points into a model and the way draws itself.</figcaption></figure><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><figure><div class="ph"><img src="story-4-390.png" alt="The Stage"></div><figcaption><b>4 · The Stage</b>The window is at the front. The 7:42, platform 3, the walk and the train; the sentence comes after the picture.</figcaption></figure></div></body></html>
