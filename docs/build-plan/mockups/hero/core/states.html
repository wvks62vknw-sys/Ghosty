<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Hero · Core · states</title>
<link rel="stylesheet" href="../../fonts.css"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1000px; background: #000; color: #f4f6f8; font-family: 'Inter Mock', sans-serif; -webkit-font-smoothing: antialiased; padding: 30px 30px 34px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 0 4px 20px; }

</style></head><body><h1>Core <span>· idle, listening, thinking</span></h1><div class="row"><figure><canvas data-hero="core" data-state="idle" data-t="12.5" data-fill="0.6"></canvas><figcaption><b>Idle</b><span>slow breathing</span></figcaption></figure><figure><canvas data-hero="core" data-state="listen" data-t="12.5" data-fill="0.6"></canvas><figcaption><b>Listening</b><span>opens and brightens</span></figcaption></figure><figure><canvas data-hero="core" data-state="think" data-t="12.9" data-fill="0.6"></canvas><figcaption><b>Thinking</b><span>ripples and pulses</span></figcaption></figure></div><script type="module">import { mountAll } from '../kit.js'; mountAll();</script></body></html>
